# Nginx reverse proxy untuk Binara LMS (DCloud VPS) — tuned untuk 1.000 peserta serentak
# Ganti api.domain-anda.com / domain-anda.com dengan domain Anda.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 8192;
  multi_accept on;
  use epoll;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  server_tokens off;
  client_max_body_size 200m;          # unggah Excel soal / ZIP materi
  log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" rt=$request_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log main;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json text/css application/javascript text/plain image/svg+xml;

  # Rate limit: login & webhook (anti brute-force), submit ujian
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:20m rate=60r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  # Docker DNS resolver agar "backend" di-resolve ke semua replika (round-robin)
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream backend_pool {
    zone backend_pool 64k;
    least_conn;
    server backend:8001 resolve;
    keepalive 128;
  }

  # ---------- HTTP -> HTTPS + ACME ----------
  server {
    listen 80;
    server_name domain-anda.com www.domain-anda.com api.domain-anda.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  # ---------- HTTPS ----------
  server {
    listen 443 ssl;
    http2 on;
    server_name domain-anda.com www.domain-anda.com api.domain-anda.com;

    ssl_certificate     /etc/letsencrypt/live/domain-anda.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domain-anda.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    limit_conn perip 50;

    # --- API ---
    location /api/auth/login {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://backend_pool;
      include /etc/nginx/proxy_params_lms;
    }

    # Webhook Midtrans: tanpa rate limit per-IP ketat, harus selalu 2xx bila valid
    location /api/payments/notification {
      proxy_pass http://backend_pool;
      include /etc/nginx/proxy_params_lms;
    }

    location /api/ {
      limit_req zone=api burst=200 nodelay;
      proxy_pass http://backend_pool;
      include /etc/nginx/proxy_params_lms;
    }

    # --- Frontend React build (opsional: bila frontend juga di VPS ini) ---
    location /static/ {
      root /var/www/frontend;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
    location / {
      root /var/www/frontend;
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
